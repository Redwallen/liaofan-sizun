<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="《了凡四训》逐句精读：原文、白话翻译、字词注释与心得，一点点读懂这本明代家训。">
<meta name="format-detection" content="telephone=no">
<title>了凡四训 · 逐句精读</title>

<!-- PWA / 添加到主屏幕 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b23a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="了凡四训">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23b23a2e'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='%23f7f2e7' font-family='serif'>凡</text></svg>">
</head>
<body>
<div id="app">

  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-seal">凡</span>
      <span class="brand-text">
        <strong>了凡四训</strong>
        <em>逐句精读</em>
      </span>
    </a>
    <nav class="topnav">
      <a href="#/" data-nav="home">目录</a>
      <a href="#/glossary" data-nav="glossary">字词</a>
      <a href="#/mynotes" data-nav="mynotes">我的笔记</a>
    </nav>
    <div class="topactions">
      <button class="iconbtn" id="searchBtn" title="搜索（/）" aria-label="搜索">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="iconbtn" id="settingsBtn" title="阅读设置" aria-label="阅读设置">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <footer class="footer">
    <p>《了凡四训》· 明 · 袁了凡 著</p>
    <p class="footer-sub">原文依据公版电子书整理 · 白话翻译与注释仅供学习参考 · 阅读进度保存在本机浏览器</p>
  </footer>
</div>

<!-- 手机底部标签栏（仅在窄屏显示） -->
<nav class="tabbar" aria-label="主导航">
  <a href="#/" data-nav="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4H9a2 2 0 0 1 2 2v13a1.6 1.6 0 0 0-1.6-1.6H3z"/><path d="M21 5.5A1.5 1.5 0 0 0 19.5 4H15a2 2 0 0 0-2 2v13a1.6 1.6 0 0 1 1.6-1.6H21z"/></svg>
    <span>目录</span>
  </a>
  <a href="#/glossary" data-nav="glossary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H12v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M12 4h6.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H12"/><path d="M7.5 9h2M7.5 12.5h2"/></svg>
    <span>字词</span>
  </a>
  <a href="#/mynotes" data-nav="mynotes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h9l5 5v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v5h5"/><path d="M8 13h7M8 17h5"/></svg>
    <span>笔记</span>
  </a>
  <button type="button" id="tabSettings" data-nav="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H2a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.4-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H8a1.7 1.7 0 0 0 1-1.5V2a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 14.6 4a1.7 1.7 0 0 0 1.9-.4l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V8a1.7 1.7 0 0 0 1.5 1H22a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    <span>设置</span>
  </button>
</nav>

<!-- 设置抽屉 -->
<div class="drawer-mask" id="drawerMask" hidden></div>
<aside class="drawer" id="settingsDrawer" hidden aria-label="阅读设置">
  <div class="drawer-head">
    <h3>阅读设置</h3>
    <button class="iconbtn" id="closeSettings" aria-label="关闭">✕</button>
  </div>
  <div class="drawer-body">
    <div class="setting">
      <label>主题</label>
      <div class="seg" data-setting="theme">
        <button data-val="paper">纸白</button>
        <button data-val="sepia">米黄</button>
        <button data-val="night">夜读</button>
      </div>
    </div>
    <div class="setting">
      <label>正文字号</label>
      <div class="seg" data-setting="fontSize">
        <button data-val="s">小</button>
        <button data-val="m">中</button>
        <button data-val="l">大</button>
        <button data-val="xl">特大</button>
      </div>
    </div>
    <div class="setting">
      <label>原文排版</label>
      <div class="seg" data-setting="writing">
        <button data-val="horizontal">横排</button>
        <button data-val="vertical">竖排</button>
      </div>
    </div>
    <div class="setting">
      <label>进入阅读时</label>
      <div class="seg" data-setting="defaultMode">
        <button data-val="focus">逐句精读</button>
        <button data-val="flow">通篇对照</button>
      </div>
    </div>
    <div class="setting">
      <label>白话译文</label>
      <div class="seg" data-setting="defaultReveal">
        <button data-val="hidden">先藏起来</button>
        <button data-val="shown">直接显示</button>
      </div>
    </div>
    <div class="setting">
      <label>朗读速度</label>
      <div class="seg" data-setting="speechRate">
        <button data-val="0.7">慢</button>
        <button data-val="0.9">中</button>
        <button data-val="1.1">快</button>
      </div>
    </div>
    <div class="setting danger-zone">
      <button class="btn ghost" id="resetProgress">清除全部阅读进度与笔记</button>
    </div>
  </div>
</aside>

<!-- 搜索面板 -->
<div class="modal-mask" id="searchMask" hidden></div>
<div class="modal search-modal" id="searchModal" hidden aria-label="搜索">
  <div class="search-input-row">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" id="searchInput" placeholder="搜索原文、译文、注释或人名…" autocomplete="off">
    <button class="iconbtn" id="closeSearch" aria-label="关闭">✕</button>
  </div>
  <div class="search-results" id="searchResults">
    <p class="search-hint">输入关键词，例如「立命」「云谷」「谦虚」「杀生」。</p>
  </div>
</div>

<div class="popover" id="popover" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="data/book.js"></script>
<script src="js/app.js"></script>
</body>
</html>
